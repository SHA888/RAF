[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raf"
version = "0.1.0"
description = "Reciprocal Acceleration Framework for Quantum-Classical Machine Learning Co-Evolution"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<4.0"
authors = [
    {name = "RAF Contributors"}
]
keywords = [
    "quantum computing",
    "machine learning",
    "quantum machine learning",
    "error mitigation",
    "variational quantum algorithms",
    "quantum architecture search",
    "co-evolutionary systems"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "networkx>=2.6.0",
    "pandas>=1.3.0",
    "pydantic>=2.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
# Core quantum simulation (recommended) – aligned to PennyLane stack (qiskit 2.x)
quantum = [
    "qiskit>=2.0,<2.2",
    "qiskit-aer~=0.17.1",
]

# AWS Braket (IonQ, Rigetti, OQC, QuEra) – qiskit 2.x
braket = [
    "amazon-braket-sdk>=1.50.0",
    "qiskit>=2.0,<2.2",
]

# Azure Quantum (IonQ, Quantinuum, Rigetti, PASQAL) – qiskit 2.x
azure = [
    "azure-quantum>=0.28.0",
    "qiskit>=2.0,<2.2",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
]
all = [
    "raf[quantum,braket,azure,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/yourusername/RAF"
Documentation = "https://raf.readthedocs.io"
Repository = "https://github.com/yourusername/RAF"
Issues = "https://github.com/yourusername/RAF/issues"

[project.scripts]
raf = "raf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["raf*"]

[tool.black]
target-version = ["py312", "py313"]
line-length = 100

[tool.isort]
py_version = "312"
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C4", "B", "UP", "ARG", "SIM", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["raf"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=raf --cov-report=term-missing --cov-report=html"
