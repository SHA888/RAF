[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raf"
version = "0.1.0"
description = "Reciprocal Acceleration Framework for Quantum-Classical Machine Learning Co-Evolution"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "RAF Contributors"}
]
keywords = [
    "quantum computing",
    "machine learning",
    "quantum machine learning",
    "error mitigation",
    "variational quantum algorithms",
    "quantum architecture search",
    "co-evolutionary systems"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "networkx>=2.6.0",
    "pandas>=1.3.0",
    "pydantic>=2.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
# Core quantum simulation (recommended)
quantum = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
]

# IBM Quantum hardware
ibm = [
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.20.0",
]

# AWS Braket (IonQ, Rigetti, OQC, QuEra)
braket = [
    "amazon-braket-sdk>=1.50.0",
    "qiskit>=1.0.0",
]

# Azure Quantum (IonQ, Quantinuum, Rigetti, PASQAL)
azure = [
    "azure-quantum>=0.28.0",
    "qiskit>=1.0.0",
]

# IQM European hardware
iqm = [
    "qiskit-iqm>=13.0",
    "qiskit>=1.0.0",
]

# PennyLane integration
pennylane = [
    "pennylane>=0.30.0",
    "pennylane-qiskit>=0.30.0",
]

# All hardware backends
all-backends = [
    "raf[quantum,ibm,braket,azure,iqm]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
]
all = [
    "raf[quantum,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/yourusername/RAF"
Documentation = "https://raf.readthedocs.io"
Repository = "https://github.com/yourusername/RAF"
Issues = "https://github.com/yourusername/RAF/issues"

[project.scripts]
raf = "raf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["raf*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=raf --cov-report=term-missing"
